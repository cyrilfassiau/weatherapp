[build]
  command = "npm run build"
  publish = "dist"

[build.environment]
  # Vite 7 requires ^20.19.0 || >=22.12.0. Netlify's default Node version
  # depends on when the site was created, so pin it rather than inherit it.
  NODE_VERSION = "22"

# Vite fingerprints every filename in assets/, so those are safe to cache
# forever. Anything a new deploy must be able to replace is not.
[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/index.html"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

# The service worker decides when clients pick up a new build. If it is itself
# cached, visitors can stay pinned to an old version indefinitely.
[[headers]]
  for = "/sw.js"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

[[headers]]
  for = "/manifest.webmanifest"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"
