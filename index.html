<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="description" content="Forecasts, current conditions and saved cities, powered by OpenWeatherMap." />
    <meta name="theme-color" content="#0b1220" />
    <link rel="icon" type="image/png" href="/icons/clear.png" />
    <title>Skycast — Weather</title>
    <script>
      // Apply the stored theme before first paint so there is no light-mode flash.
      (function () {
        try {
          var stored = JSON.parse(localStorage.getItem('skycast:settings') || '{}');
          var theme = stored.theme || 'system';
          var dark =
            theme === 'dark' ||
            (theme === 'system' && window.matchMedia('(prefers-color-scheme: dark)').matches);
          document.documentElement.classList.toggle('dark', dark);
        } catch (e) {}
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
